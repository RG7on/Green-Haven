services:
  # Backend Service
  - type: web
    name: green-haven-backend
    runtime: node
    region: oregon
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_PORT
        value: 10000
    healthCheckPath: /api/health

  # Frontend Service
  - type: web
    name: green-haven-frontend
    runtime: static
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: green-haven-backend
          type: web
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
