services:
  # Backend Service
  - type: web
    name: green-haven-backend
    runtime: node
    region: oregon
    plan: free
    rootDir: server
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: APP_PORT
        value: 5000
    healthCheckPath: /api/health

  # Frontend Service (Static Site)
  - type: static
    name: green-haven-frontend
    region: oregon
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: green-haven-backend
          type: web
          property: url
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
